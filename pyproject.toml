[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-network-resilience"
version = "2.0.0"
description = "ILP models for resilient (protected) routing in optical core networks"
requires-python = ">=3.10"
dependencies = ["networkx>=3.0", "geopy>=2.3", "pulp>=2.8,<3", "highspy>=1.7", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
